<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="css/index.css">
  <title>Мои финансы</title>

<body>

<div class="app">
  <form id="finance-form">
    <div class="app_summ">
      <div class="app_summ_label">Итого денег:</div>
      <div id="total-balance" class="app_summ_value">0 ₽</div>

    <div id="accounts-list" class="app_content">
      <!-- Здесь будут отображаться банковские счета -->
    </div>
    <div class="app_buttons">
      <button id="add-account-row" type="button">Добавить новый счет</button>
      <button id="save-accounts" type="button">Сохранить изменения</button>
    </div>
  </form>
</div>

<script src="js/index.js"></script>

</html>
